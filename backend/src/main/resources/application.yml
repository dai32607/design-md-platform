server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/design_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET:design-md-platform-jwt-secret-key-2026-change-me-in-prod}
    expiration: 86400000

# AI 生成设计规范（Agent 闭环）
# 兼容 OpenAI 格式（如 DeepSeek: https://api.deepseek.com）
# 未配置 api-key 时自动启用 mock 模式，返回示例 DESIGN.md
llm:
  base-url: https://api.deepseek.com
  # 填写真实 api-key 即切换为真实大模型调用（无需改动业务代码）；留空则自动走 mock 演示模式
  api-key: "${DEEPSEEK_API_KEY:}"
  model: deepseek-chat
  # 连接超时（毫秒）：建连失败快速失败，不拖垮请求线程
  connect-timeout-ms: 10000
  # 读取超时（毫秒）：规范文档输出较长，默认 120s
  read-timeout-ms: 120000
  # 失败重试次数（仅网络异常/超时/429/5xx 生效），总尝试次数 = max-retries + 1
  max-retries: 2
  # 重试退避基数（毫秒），按指数增长，封顶 5s
  retry-backoff-ms: 800

# springdoc OpenAPI 文档：仅扫描 /api/**，swagger-ui 开启（演示包本地可用；生产环境建议加鉴权）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  paths-to-match: /api/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.designmd.platform: debug
